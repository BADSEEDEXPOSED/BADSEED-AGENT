name = "badseed-agent"
main = "worker.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat", "nodejs_compat_populate_process_env"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[routes]]
pattern = "agent.badseed.exposed"
custom_domain = true
